name: Report Installation Issue
description: Upload your log file to report a setup problem
title: "Installation Issue"
labels: ["installation"]
body:
  - type: markdown
    attributes:
      value: |
        Please upload your diagnostic log file below.
  - type: textarea
    id: log_file
    attributes:
      label: Diagnostic Log File
      description: Drag and drop the `flutter_vscode_install.log` file from your Downloads folder here.
      placeholder: Drag and drop flutter_vscode_install.log here or paste its contents...
    validations:
      required: true
